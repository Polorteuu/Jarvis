<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de voz</title>
<style>
  :root { --bg:#0f1218; --card:#1a1f2b; --text:#eef1f6; --muted:#9aa4b5; --accent:#4cc3ff; --me:#26324a; --ai:#1f3b2f; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 12px; }
  details { background:var(--card); border-radius:12px; padding:10px 14px; margin-bottom:14px; }
  summary { cursor:pointer; color:var(--muted); }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:.9rem; }
  input[type=password], input[type=text], select { width:100%; padding:10px; border-radius:8px; border:1px solid #333b4d; background:#10141c; color:var(--text); font-size:1rem; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .check { display:flex; gap:8px; align-items:center; margin:10px 0 0; color:var(--text); }
  #talk { width:100%; min-height:34vh; padding:20px; font-size:1.9rem; border:0; border-radius:18px; background:var(--accent); color:#04202e; font-weight:700; cursor:pointer; margin-bottom:10px; }
  #talk.on { background:var(--danger); color:#fff; }
  #testvoice { width:100%; padding:14px; font-size:1.1rem; border:1px solid #333b4d; border-radius:12px; background:var(--card); color:var(--text); margin-bottom:10px; cursor:pointer; }
  #status { text-align:center; color:var(--muted); margin-bottom:10px; min-height:1.4em; }
  #live { background:var(--card); border-radius:12px; padding:12px; min-height:56px; font-size:1.25rem; color:var(--muted); margin-bottom:12px; }
  #log { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .msg { padding:12px 14px; border-radius:12px; font-size:1.35rem; line-height:1.4; white-space:pre-wrap; }
  .me { background:var(--me); align-self:flex-end; max-width:90%; }
  .ai { background:var(--ai); align-self:flex-start; max-width:90%; }
  form { display:flex; gap:8px; }
  form input { flex:1; }
  form button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#04202e; font-weight:700; font-size:1rem; }
  .small { font-size:.85rem; color:var(--muted); }
  .err { color:var(--danger); }
</style>
</head>
<body>
<main>
  <h1>Asistente de voz</h1>

  <details id="settings" open>
    <summary>Ajustes</summary>
    <label for="key">Clave de API de Anthropic</label>
    <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
    <label for="model">Modelo</label>
    <input id="model" type="text" value="claude-sonnet-5-5">
    <label for="lang">Idioma de escucha y voz</label>
    <select id="lang">
      <option value="es-ES">Castellano</option>
      <option value="ca-ES">Català</option>
      <option value="en-US">English</option>
    </select>
    <label class="check"><input id="wake" type="checkbox"> Responder solo cuando oiga la palabra "Jarvis"</label>
    <label class="check"><input id="speak" type="checkbox" checked> Leer las respuestas en voz alta</label>
    <p class="small">La clave se guarda solo en este navegador. Si desactivas la palabra "Jarvis", responderá a todo lo que oiga.</p>
  </details>

  <button id="talk">Empezar a escuchar</button>
  <div id="status"></div>
  <button id="testvoice" type="button">Probar voz</button>
  <div id="live">Aquí verás lo que oigo, en directo.</div>
  <div id="log"></div>

  <form id="typed">
    <input id="typedText" type="text" placeholder="O escribe aquí..." autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var keyEl = $('key'), modelEl = $('model'), langEl = $('lang'), wakeEl = $('wake'), speakEl = $('speak');
  var talkBtn = $('talk'), statusEl = $('status'), liveEl = $('live'), logEl = $('log');

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  keyEl.value = load('jv_key') || '';
  modelEl.value = load('jv_model') || modelEl.value;
  langEl.value = load('jv_lang') || langEl.value;
  if (load('jv_wake') !== null) wakeEl.checked = load('jv_wake') === '1';
  if (load('jv_speak') !== null) speakEl.checked = load('jv_speak') === '1';
  if (keyEl.value) $('settings').open = false;

  keyEl.addEventListener('change', function () { save('jv_key', keyEl.value.trim()); });
  modelEl.addEventListener('change', function () { save('jv_model', modelEl.value.trim()); });
  langEl.addEventListener('change', function () { save('jv_lang', langEl.value); if (listening) restartRecognition(); });
  wakeEl.addEventListener('change', function () { save('jv_wake', wakeEl.checked ? '1' : '0'); });
  speakEl.addEventListener('change', function () { save('jv_speak', speakEl.checked ? '1' : '0'); });

  function setStatus(t, isErr) { statusEl.textContent = t; statusEl.className = isErr ? 'err' : ''; }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('Este navegador no tiene reconocimiento de voz. Usa Chrome (Android u ordenador).', true);
    talkBtn.disabled = true;
  }

  var recognition = null, listening = false, speaking = false, busy = false, autoStarting = false, wakeLock = null;
  var history = [];

  function addMsg(cls, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    if (cls === 'ai') {
      d.addEventListener('click', function () { if (d.textContent) speakSentence(d.textContent, true); });
    }
    logEl.appendChild(d);
    d.scrollIntoView({ block: 'end', behavior: 'smooth' });
    return d;
  }

  function buildRecognition() {
    var r = new SR();
    r.lang = langEl.value;
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var res = ev.results[i];
        var t = res[0].transcript;
        if (res.isFinal) { handleHeard(t.trim()); } else { interim += t; }
      }
      liveEl.textContent = interim || liveEl.textContent;
    };
    r.onerror = function (ev) {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        stopListening();
        if (autoStarting) {
          setStatus('Toca el botón grande para empezar a escuchar.');
        } else {
          setStatus('No tengo permiso para usar el micrófono. Actívalo en los ajustes del navegador.', true);
        }
      } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') {
        setStatus('Error de reconocimiento: ' + ev.error, true);
      }
    };
    r.onend = function () {
      if (listening && !speaking && !busy) { try { r.start(); } catch (e) {} }
    };
    return r;
  }

  function startRecognition() {
    if (!recognition) recognition = buildRecognition();
    try { recognition.start(); } catch (e) {}
  }
  function pauseRecognition() { if (recognition) { try { recognition.stop(); } catch (e) {} } }
  function restartRecognition() { pauseRecognition(); recognition = null; setTimeout(startRecognition, 300); }

  function startListening() {
    listening = true;
    talkBtn.textContent = 'Escuchando... (toca para parar)';
    talkBtn.classList.add('on');
    setStatus(wakeEl.checked ? 'Di "Jarvis" y tu pregunta.' : 'Te escucho. Habla.');
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
      }
    } catch (e) {}
    startRecognition();
  }
  function stopListening() {
    listening = false;
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
    talkBtn.textContent = 'Empezar a escuchar';
    talkBtn.classList.remove('on');
    pauseRecognition();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setStatus('');
  }
  talkBtn.addEventListener('click', function () { unlockSpeech(); listening ? stopListening() : startListening(); });
  $('testvoice').addEventListener('click', function () {
    setStatus('Voz de prueba. Si no oyes nada, mira el interruptor de silencio y el volumen del iPhone.');
    speakSentence('Hola. Si me oyes, la voz funciona.', true);
  });

  function handleHeard(text) {
    if (!text) return;
    liveEl.textContent = text;
    if (wakeEl.checked) {
      var m = text.match(/\bjarvis\b[\s,.:;!?-]*/i);
      if (!m) return;
      text = text.slice(m.index + m[0].length).trim() || text;
    }
    ask(text);
  }

  document.getElementById('typed').addEventListener('submit', function (e) {
    e.preventDefault();
    unlockSpeech();
    var v = $('typedText').value.trim();
    if (v) { $('typedText').value = ''; ask(v); }
  });

  var SYSTEM = 'Eres un asistente personal por voz, como Jarvis. La persona con la que hablas es sorda y usa implantes cocleares, y recibe tus respuestas leídas en voz alta y también en pantalla. ' +
    'Responde en el mismo idioma en que te hablen. Sé claro, directo y breve: normalmente una a tres frases. ' +
    'No uses markdown, listas, emojis ni símbolos raros, porque tu respuesta se lee en voz alta. Si no has entendido bien lo que dice la transcripción, pide que lo repita en una frase corta. ' +
    'La transcripción puede tener errores de reconocimiento de voz: interpreta con sentido común.';

  var queue = [], pendingSpeech = 0;

  // Desbloquea la voz con un toque del usuario (iPhone lo exige).
  function unlockSpeech() {
    try {
      if (!window.speechSynthesis) return;
      var u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function speakSentence(s, force) {
    if ((!speakEl.checked && !force) || !window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(s);
    u.lang = langEl.value;
    var voices = window.speechSynthesis.getVoices();
    var pref = voices.filter(function (v) { return v.lang && v.lang.replace('_', '-').indexOf(langEl.value) === 0; })[0] ||
               voices.filter(function (v) { return v.lang && v.lang.slice(0, 2) === langEl.value.slice(0, 2); })[0];
    if (pref) u.voice = pref;
    pendingSpeech++;
    speaking = true;
    pauseRecognition();
    var done = function () {
      pendingSpeech--;
      if (pendingSpeech <= 0) {
        pendingSpeech = 0; speaking = false;
        if (listening && !busy) setTimeout(startRecognition, 250);
      }
    };
    u.onend = done; u.onerror = done;
    if (force) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } else {
      // Pequeña espera para que el micrófono se libere antes de hablar.
      setTimeout(function () { window.speechSynthesis.speak(u); }, 350);
    }
  }

  function ask(text) {
    var key = keyEl.value.trim();
    if (!key) {
      // Modo prueba: sin clave no hay IA, pero se puede comprobar el micrófono y la voz.
      if (busy) return;
      addMsg('me', text);
      var demo = 'Prueba sin IA. He entendido: ' + text;
      addMsg('ai', demo);
      setStatus('Modo prueba: falta la clave de API en Ajustes.');
      speakSentence(demo);
      return;
    }
    if (busy) return;
    busy = true;
    pauseRecognition();
    addMsg('me', text);
    history.push({ role: 'user', content: text });
    if (history.length > 20) history = history.slice(-20);
    setStatus('Pensando...');
    var bubble = addMsg('ai', '');
    var full = '', carry = '';

    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: modelEl.value.trim() || 'claude-sonnet-5-5',
        max_tokens: 400,
        system: SYSTEM,
        messages: history,
        stream: true
      })
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (t) { throw new Error('HTTP ' + resp.status + ' ' + t.slice(0, 200)); });
      }
      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var buf = '';

      function flushSentences(final) {
        var re = /^([\s\S]*?[.!?…]+)(\s+|$)/;
        var m;
        while ((m = carry.match(re)) && (final || m[2].length > 0)) {
          speakSentence(m[1].trim());
          carry = carry.slice(m[0].length);
        }
        if (final && carry.trim()) { speakSentence(carry.trim()); carry = ''; }
      }

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { flushSentences(true); return; }
          buf += dec.decode(r.value, { stream: true });
          var parts = buf.split('\n\n');
          buf = parts.pop();
          parts.forEach(function (p) {
            var line = p.split('\n').filter(function (l) { return l.indexOf('data: ') === 0; })[0];
            if (!line) return;
            try {
              var j = JSON.parse(line.slice(6));
              if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') {
                full += j.delta.text; carry += j.delta.text;
                bubble.textContent = full;
                flushSentences(false);
              }
            } catch (e) {}
          });
          return pump();
        });
      }
      setStatus('');
      return pump();
    }).then(function () {
      if (full) history.push({ role: 'assistant', content: full });
      else history.pop();
    }).catch(function (err) {
      history.pop();
      bubble.textContent = 'Error: ' + err.message;
      setStatus('No he podido contactar con la IA. Revisa la clave y la conexión.', true);
    }).then(function () {
      busy = false;
      if (listening && !speaking) setTimeout(startRecognition, 250);
    });
  }

  if (window.speechSynthesis) { window.speechSynthesis.onvoiceschanged = function () {}; window.speechSynthesis.getVoices(); }

  // Al abrir la página, intenta empezar a escuchar sola si ya hay clave guardada.
  // Si el navegador lo bloquea, basta con tocar el botón grande.
  if (SR && keyEl.value) {
    autoStarting = true;
    startListening();
    setTimeout(function () { autoStarting = false; }, 4000);
  } else if (SR) {
    setStatus('Toca el botón grande para empezar a escuchar.');
  }
})();
</script>
</body>
</html>
